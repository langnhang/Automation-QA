name: CI Automation Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * *'  # Run daily at 9 AM Vietnam time (UTC+7)
    - cron: '0 14 * * *'   # Run daily at 2 AM UTC
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chrome, firefox]
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Clean reports directory
      run: |
        rm -rf reports/
        rm -rf screenshots/
        rm -rf .pytest_cache
        mkdir -p reports/
        mkdir -p screenshots/

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Chrome and ChromeDriver
      if: matrix.browser == 'chrome'
      run: |
        wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
        sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable

        CHROME_VERSION=$(google-chrome --version | grep -oP '\d+\.\d+\.\d+')
        CHROMEDRIVER_VERSION=$(curl -s "https://googlechromelabs.github.io/chrome-for-testing/latest-patch-versions-per-build-with-downloads.json" | jq -r ".builds.\"${CHROME_VERSION}\".version")
        wget -q "https://storage.googleapis.com/chrome-for-testing-public/${CHROMEDRIVER_VERSION}/linux64/chromedriver-linux64.zip"
        unzip -q chromedriver-linux64.zip
        sudo mv chromedriver-linux64/chromedriver /usr/local/bin/chromedriver
        sudo chmod +x /usr/local/bin/chromedriver
        chromedriver --version

    - name: Install Firefox
      if: matrix.browser == 'firefox'
      uses: browser-actions/setup-firefox@v1
      with:
        firefox-version: latest

    - name: Run tests
      env:
        BROWSER: ${{ matrix.browser }}
        HEADLESS: true
      run: |
        timestamp=$(date +%Y%m%d_%H%M%S)
        pytest tests/ \
          -v \
          --tb=short \
          --maxfail=5 \
          --html=reports/report_${timestamp}_${{ matrix.browser }}.html \
          --self-contained-html \
          --junit-xml=reports/junit_${timestamp}_${{ matrix.browser }}.xml

    - name: Display test summary
      if: always()
      run: |
        echo "## Test Results - ${{ matrix.browser }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -f reports/history/index.json ]; then
          python3 << 'EOF'
import json
with open('reports/history/index.json') as f:
    data = json.load(f)
    if data:
        run = data[0]
        print(f"- **Total Tests**: {run['total']}", file=open('$GITHUB_STEP_SUMMARY', 'a'))
        print(f"- **Passed**: {run['passed']} ✅", file=open('$GITHUB_STEP_SUMMARY', 'a'))
        print(f"- **Failed**: {run['failed']} ❌", file=open('$GITHUB_STEP_SUMMARY', 'a'))
        print(f"- **Errors**: {run['error']} ⚠️", file=open('$GITHUB_STEP_SUMMARY', 'a'))
        print(f"- **Pass Rate**: {run['pass_rate']}%", file=open('$GITHUB_STEP_SUMMARY', 'a'))
        print(f"- **Duration**: {run['duration']}s", file=open('$GITHUB_STEP_SUMMARY', 'a'))
EOF
        else
          echo "⚠️ No history file found" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.browser }}-${{ github.run_number }}
        path: |
          reports/
          screenshots/
        retention-days: 30

  notify:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Check test status
      run: |
        if [ "${{ needs.test.result }}" == "failure" ]; then
          echo "❌ Tests failed!"
          exit 1
        else
          echo "✅ All tests passed!"
        fi
