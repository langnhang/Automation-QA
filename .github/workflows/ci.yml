name: CI Automation Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * *'  # Run daily at 9 AM Vietnam time (UTC+7)
    - cron: '0 14 * * *'   # Run daily at 2 AM UTC
  workflow_dispatch:  # Allow manual trigger

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chrome, firefox]
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Clean reports directory
      run: |
        rm -rf reports/
        rm -rf screenshots/
        rm -rf .pytest_cache
        mkdir -p reports/
        mkdir -p screenshots/

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Chrome and ChromeDriver
      if: matrix.browser == 'chrome'
      run: |
        # Install Chrome
        wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
        sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable

        # Install matching ChromeDriver
        CHROME_VERSION=$(google-chrome --version | grep -oP '\d+\.\d+\.\d+')
        CHROMEDRIVER_VERSION=$(curl -s "https://googlechromelabs.github.io/chrome-for-testing/latest-patch-versions-per-build-with-downloads.json" | jq -r ".builds.\"${CHROME_VERSION}\".version")
        wget -q "https://storage.googleapis.com/chrome-for-testing-public/${CHROMEDRIVER_VERSION}/linux64/chromedriver-linux64.zip"
        unzip -q chromedriver-linux64.zip
        sudo mv chromedriver-linux64/chromedriver /usr/local/bin/chromedriver
        sudo chmod +x /usr/local/bin/chromedriver
        chromedriver --version

    - name: Install Firefox
      if: matrix.browser == 'firefox'
      uses: browser-actions/setup-firefox@v1
      with:
        firefox-version: latest

    - name: Run tests
      env:
        BROWSER: ${{ matrix.browser }}
        HEADLESS: true
      run: |
        timestamp=$(date +%Y%m%d_%H%M%S)
        pytest tests/ \
          -v \
          --tb=short \
          --maxfail=5 \
          -n auto \
          --html=reports/report_${timestamp}_${{ matrix.browser }}.html \
          --self-contained-html \
          --junit-xml=reports/junit_${timestamp}_${{ matrix.browser }}.xml

    - name: Generate test summary
      if: always()
      run: |
        echo "## Test Results - ${{ matrix.browser }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -f reports/junit_*.xml ]; then
          echo "✅ Test execution completed" >> $GITHUB_STEP_SUMMARY
          python3 << 'EOF'
import xml.etree.ElementTree as ET
import glob

# Find the latest junit xml file
junit_files = glob.glob('reports/junit_*.xml')
if junit_files:
    junit_file = sorted(junit_files)[-1]
    tree = ET.parse(junit_file)
    root = tree.getroot()
    
    total = root.get('tests', '0')
    failures = root.get('failures', '0')
    errors = root.get('errors', '0')
    skipped = root.get('skipped', '0')
    passed = int(total) - int(failures) - int(errors) - int(skipped)
    
    print(f"- **Total Tests**: {total}", file=open('$GITHUB_STEP_SUMMARY', 'a'))
    print(f"- **Passed**: {passed} ✅", file=open('$GITHUB_STEP_SUMMARY', 'a'))
    print(f"- **Failed**: {failures} ❌", file=open('$GITHUB_STEP_SUMMARY', 'a'))
    print(f"- **Errors**: {errors} ⚠️", file=open('$GITHUB_STEP_SUMMARY', 'a'))
    print(f"- **Skipped**: {skipped} ⏭️", file=open('$GITHUB_STEP_SUMMARY', 'a'))
    
    if int(total) > 0:
      pass_rate = (passed / int(total)) * 100
      print(f"- **Pass Rate**: {pass_rate:.2f}%", file=open('$GITHUB_STEP_SUMMARY', 'a'))
EOF
        else
          echo "⚠️ No test results found" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.browser }}-${{ github.run_number }}
        path: |
          reports/
          screenshots/
        retention-days: 30
        if-no-files-found: warn

  notify:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Check test status
      run: |
        if [ "${{ needs.test.result }}" == "failure" ]; then
          echo "❌ Tests failed!"
          exit 1
        else
          echo "✅ Tests passed!"
        fi
